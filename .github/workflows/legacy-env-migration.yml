name: Legacy WordPress env migration

on:
  push:
    paths:
      - '.github/workflows/legacy-env-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace legacy WordPress env references in code
        shell: bash
        run: |
          set -euo pipefail
          patterns=( '*.js' '*.ts' '*.tsx' '*.mjs' '*.cjs' '*.py' '*.sh' '*.bash' '*.zsh' '*.yml' '*.yaml' '*.json' )
          mapfile -t files < <(git grep -l -E 'WP_USER|WP_SEO_APP_PASSWORD|WP_APP_PASSWORD' -- "${patterns[@]}" ':!.github/workflows/legacy-env-migration.yml' || true)

          for file in "${files[@]}"; do
            perl -0pi -e 's/process\.env\.WP_USER/process.env.WORDPRESS_API_USERNAME/g; s/process\.env\.WP_SEO_APP_PASSWORD/process.env.WORDPRESS_API_APP_PASSWORD/g; s/process\.env\.WP_APP_PASSWORD/process.env.WORDPRESS_API_APP_PASSWORD/g; s/\bWP_SEO_APP_PASSWORD\b/WORDPRESS_API_APP_PASSWORD/g; s/\bWP_APP_PASSWORD\b/WORDPRESS_API_APP_PASSWORD/g; s/\bWP_USER\b/WORDPRESS_API_USERNAME/g' "$file"
          done

          echo "Remaining legacy references in code/config:"
          if git grep -n -E '\b(WP_USER|WP_SEO_APP_PASSWORD|WP_APP_PASSWORD)\b' -- "${patterns[@]}" ':!.github/workflows/legacy-env-migration.yml'; then
            echo "Legacy references remain."
            exit 1
          fi
          echo "None."

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "refactor: finish legacy WordPress env migration"
          git push
